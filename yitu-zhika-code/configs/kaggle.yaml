# ============================================================
# 一图知卡 - Kaggle 环境配置
# 在 default.yaml 基础上覆盖 Kaggle 特有路径和参数
# 用法: python src/training/train_multitask.py --config configs/kaggle.yaml
# ============================================================

# 数据路径覆盖（Kaggle 挂载点）
data:
  hsifoodingr_path: "/kaggle/input/hsifoodingr64/HSIFoodIngr-64"
  nutrition5k_path: "/kaggle/input/nutrition5k/Nutrition5k"
  num_workers: 2               # Kaggle 环境减少工作进程
  augmentation: true

# 生成器配置
generator:
  batch_size: 8                # Kaggle GPU 显存有限，减小 batch
  epochs: 100                  # Kaggle 运行时间限制
  save_interval: 20

# 多任务配置
multitask:
  batch_size: 16
  epochs: 50
  save_interval: 10

# 通用
output_dir: "/kaggle/working/output"
checkpoint_dir: "/kaggle/working/checkpoints"
log_dir: "/kaggle/working/logs"
device: "cuda"
