/* ============================================================
   ENGINE — usually no need to edit below this line.
   ============================================================ */
const store = {
  load() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return structuredClone(CONFIG.seed);
  },
  save(items) { localStorage.setItem(CONFIG.storageKey, JSON.stringify(items)); },
};

let items = store.load();
let currentView = "table";

const $ = sel => document.querySelector(sel);
const statusOf = k => CONFIG.statuses.find(s => s.key === k) || { label: k, color: "#eee", text: "#333" };
const prioOf = k => CONFIG.priorities.find(p => p.key === k) || { key: k, color: "#eee", text: "#333" };

function filtered() {
  const s = $("#filter-status").value, p = $("#filter-priority").value, q = $("#search").value.trim().toLowerCase();
  return items.filter(i =>
    (!s || i.status === s) && (!p || i.priority === p) && (!q || (i.name || "").toLowerCase().includes(q))
  );
}

function renderStats() {
  $("#stats").innerHTML = CONFIG.stats.map(s =>
    `<div class="stat"><div class="label">${s.label}</div><div class="value">${s.calc(items)}</div></div>`
  ).join("");
}

function cell(item, col) {
  const v = item[col.key] ?? "";
  if (col.type === "status") { const s = statusOf(v); return `<span class="badge" style="background:${s.color};color:${s.text}"><span class="dot"></span>${s.label}</span>`; }
  if (col.type === "priority") { const p = prioOf(v); return `<span class="badge" style="background:${p.color};color:${p.text}">${p.key}</span>`; }
  return v;
}

function renderTable() {
  $("#thead-row").innerHTML = CONFIG.columns.map(c => `<th>${c.label}</th>`).join("") + `<th class="col-actions">操作</th>`;
  $("#tbody").innerHTML = filtered().map(item =>
    `<tr data-id="${item.id}">` +
    CONFIG.columns.map(c => `<td class="${c.key === "name" ? "name" : ""}">${cell(item, c)}</td>`).join("") +
    `<td class="col-actions"><button class="icon-btn js-del" title="删除">${TRASH_SVG}</button></td>` +
    `</tr>`
  ).join("");
  $("#tbody").querySelectorAll("td.name").forEach(td =>
    td.onclick = () => openModal(items.find(i => i.id == td.parentElement.dataset.id)));
  $("#tbody").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest("tr").dataset.id)); });
}

function renderBoard() {
  const data = filtered();
  $("#view-board").innerHTML = CONFIG.statuses.map(s => {
    const list = data.filter(i => i.status === s.key);
    return `<div class="col" data-status="${s.key}">
      <h3>${s.label}<span class="count">${list.length}</span></h3>
      <div class="col-body">${list.map(ticketHTML).join("")}</div>
    </div>`;
  }).join("");
  wireDnD();
}

function ticketHTML(item) {
  const p = prioOf(item.priority);
  return `<div class="ticket" draggable="true" data-id="${item.id}">
    <button class="icon-btn js-del t-del" title="删除">${TRASH_SVG}</button>
    <div class="t-name">${item.name}</div>
    <div class="t-meta">

      <span>${item.owner || "暂无"}</span>

}

function wireDnD() {
  let dragId = null;
  $("#view-board").querySelectorAll(".ticket").forEach(t => {
    t.ondragstart = () => { dragId = t.dataset.id; t.classList.add("dragging"); };
    t.ondragend = () => t.classList.remove("dragging");
    t.onclick = () => openModal(items.find(i => i.id == t.dataset.id));
  });
  $("#view-board").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest(".ticket").dataset.id)); });
  $("#view-board").querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop-hover"); };
    col.ondragleave = () => col.classList.remove("drop-hover");
    col.ondrop = () => {
      col.classList.remove("drop-hover");
      const item = items.find(i => i.id == dragId);
      if (item) { item.status = col.dataset.status; persist(); }
    };
  });
}

function render() {
  renderStats();
  $("#view-table").classList.toggle("hidden", currentView !== "table");
  $("#view-board").classList.toggle("hidden", currentView !== "board");
  currentView === "table" ? renderTable() : renderBoard();
}
function persist() { store.save(items); render(); }

/* ---- editor modal ---- */
function openModal(item) {
  const editing = !!item;
  const d = item || { id: Date.now(), name: "", status: CONFIG.statuses[0].key, owner: "", priority: CONFIG.priorities.at(-1).key, line: "", created: new Date().toISOString().slice(0, 10) };
  const opts = (arr, sel, lab = x => x.label || x.key, val = x => x.key) =>
    arr.map(x => `<option value="${val(x)}" ${val(x) === sel ? "selected" : ""}>${lab(x)}</option>`).join("");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <h2>${editing ? "编辑工作项" : "新建工作项"}</h2>
    <div class="sub">${editing ? "修改后点击保存生效" : "填写信息创建一条新的工作项"}</div>
    <div class="field"><label>名称</label><input id="m-name" value="${d.name}" placeholder="输入工作项名称" /></div>
    <div class="field"><label>负责人</label><input id="m-owner" value="${d.owner}" placeholder="输入负责人" /></div>
    <div class="field"><label>业务线</label><input id="m-line" value="${d.line || ""}" placeholder="输入业务线" /></div>
    <div class="field"><label>状态</label><select id="m-status">${opts(CONFIG.statuses, d.status)}</select></div>
    <div class="field"><label>优先级</label><select id="m-priority">${opts(CONFIG.priorities, d.priority)}</select></div>
    <div class="modal-actions">
      ${editing ? '<button class="link-danger" id="m-del">删除</button>' : ""}
      <div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-save">保存</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector("#m-save").onclick = () => {
    d.name = overlay.querySelector("#m-name").value.trim() || "未命名";
    d.owner = overlay.querySelector("#m-owner").value.trim();
    d.line = overlay.querySelector("#m-line").value.trim();
    d.status = overlay.querySelector("#m-status").value;
    d.priority = overlay.querySelector("#m-priority").value;
    if (!editing) items.unshift(d);
    persist(); close();
  };
  if (editing) overlay.querySelector("#m-del").onclick = () => { close(); confirmDelete(d); };
}

/* ---- delete confirmation ---- */
function confirmDelete(item) {
  if (!item) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:380px">
    <h2>删除工作项</h2>
    <div class="sub">确定删除「${item.name}」？此操作不可撤销。</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">取消</button>
      <button class="btn danger" id="c-ok">删除</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#c-cancel").onclick = close;
  overlay.querySelector("#c-ok").onclick = () => { items = items.filter(i => i.id !== item.id); persist(); close(); };
}

/* ---- wire controls ---- */
function initFilters() {
  $("#filter-status").insertAdjacentHTML("beforeend", CONFIG.statuses.map(s => `<option value="${s.key}">${s.label}</option>`).join(""));
  $("#filter-priority").insertAdjacentHTML("beforeend", CONFIG.priorities.map(p => `<option value="${p.key}">${p.key}</option>`).join(""));
}
document.querySelectorAll(".tab").forEach(tab =>
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentView = tab.dataset.view;
    render();
  });
["#filter-status", "#filter-priority", "#search"].forEach(sel => $(sel).oninput = render);
$("#btn-new").onclick = () => openModal(null);

initFilters();
render();
</script>
</body>
</html>
