project:
  name: "Food Calorie Estimation with Multi-Spectral Images"
  description: "复现论文 Multi-Spectral Food Classification and Caloric Estimation Using Predicted Images"

data:
  hsifoodingr64:
    rgb_dir: "data/HSIFoodIngr-64_real/RGB"
    nir_dir: "data/HSIFoodIngr-64_real/NIR"
    image_size: 256
    train_ratio: 0.8
  nutrition5k:
    rgb_dir: "data/Nutrition5k_real/images"
    labels_file: "data/Nutrition5k_real/labels_clean.csv"
    image_size: 224
    train_ratio: 0.8
    num_classes: 50
    # 是否对卡路里/重量做 log1p 缩放 (推荐 True, 因为标签跨度 1~3000+)
    log_target: true
    # 训练时只用 top-K 样本数 >= min_samples_per_class 的类 (labels_clean.csv 已过滤)

models:
  nir_generator:
    type: "unet"
    in_channels: 3
    out_channels: 1
    base_channels: 64
    num_downs: 7
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999
    lambda_l1: 100.0
  multitask:
    backbone: "resnet50"
    pretrained: true
    in_channels: 4
    num_classes: 50
    hidden_dim: 512
    dropout: 0.3
    lr: 0.001
    weight_decay: 0.0001
    lambda_cls: 1.0
    lambda_cal: 0.5
    lambda_weight: 0.3
  baseline:
    type: "calorie_clip"
    backbone: "resnet50"
    pretrained: true
    in_channels: 3
    num_classes: 70
    lr: 0.001

training:
  nir_generator:
    epochs: 30
    batch_size: 8
    save_interval: 10
    log_interval: 10
    device: "cpu"
  multitask:
    epochs: 25
    batch_size: 8
    save_interval: 5
    log_interval: 10
    device: "cpu"

evaluation:
  metrics:
    - "psnr"
    - "ssim"
    - "mape"
    - "rmse"
    - "accuracy"

output:
  checkpoints_dir: "checkpoints"
  results_dir: "results"
  logs_dir: "logs"
